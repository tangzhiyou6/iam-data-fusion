logging:
  logback:
    rollingpolicy:
      async: true
      max-history: 30
      max-file-size: 10MB
  pattern:
    # console: ${CONSOLE_LOG_PATTERN:%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(%L){blue} %clr([%15.15t]){faint} %clr(%C{1}.%M){cyan} - %msg%n%clr(%ex){red}}
    console: ${CONSOLE_LOG_PATTERN:%clr(%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%thread]) %clr(%C{1}.%M[%L]){cyan} - %msg%n%clr(%ex){red}}
    file: ${FILE_LOG_PATTERN:%date{HH:mm:ss.SSS} [%thread] %-5level %logger{36}.%M[%L] - %msg%n}
  file:
    name: logs/${spring.application.name}.log
  level:
    root: INFO
    org.springframework.web: INFO

